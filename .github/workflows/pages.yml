# Refresh SCA3 sources, then publish the static site to GitHub Pages.
# Runs daily, on every push to main, and on demand from the Actions tab.
#
# configure-pages is called with enablement: true so it will try to turn Pages
# on when the site does not exist yet. Creating a Pages site requires a token
# other than the workflow GITHUB_TOKEN (a personal access token, or a GitHub
# App with administration:write and pages:write). Until Pages exists and its
# source is GitHub Actions, the owner sets that once under
# Settings → Pages → Build and deployment → Source.

name: Refresh and deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Daily, a few minutes past the hour so it misses the cron stampede.
    - cron: "23 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  models: read

# Let an in-progress production deploy finish. Skip older queued runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # page_url is set only by the attempt that succeeded. A failed attempt
      # leaves it empty, so the next one fills in.
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_retry_2.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCA3_SUMMARY_MODEL: openai/gpt-4.1-mini
        run: python3 fetch.py --check-models

      - name: Refresh the ledger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCA3_SUMMARY_MODEL: openai/gpt-4.1-mini
        run: python3 fetch.py

      - name: Assemble static site
        # Only the pages the browser needs. fetch.py, the workflow, and the
        # README stay out of the published artifact.
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html research.html about.html stand.html trials.html pipeline.html working.html families.html glossary.html resources.html sitemap.xml _site/
          cp -a css js data img fonts _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      # Artifacts belong to the workflow run, not the attempt. A re-run keeps
      # the previous attempt's artifact, and deploy-pages fails unless exactly
      # one artifact has the name it is given. Name this attempt's artifact so
      # the upload and the deploy agree.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      # deploy-pages reads artifact metadata that is sometimes not visible
      # for a few seconds after upload-pages-artifact returns. The lookup
      # then fails with "Found 0 artifact(s)" / no artifact named
      # github-pages-<attempt>. Retry the same artifact after a wait. The
      # last attempt does not set continue-on-error, so the job fails when
      # every attempt fails. Earlier attempts do, so a later success can
      # still pass the job.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Wait for Pages artifact metadata
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Wait for Pages artifact metadata again
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (second retry)
        id: deployment_retry_2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
