# Temporary proof run for the GitHub Models summary check on this branch.
# This job does not deploy GitHub Pages. Delete this file after the run is recorded.

name: Check GitHub Models

on:
  push:
    branches:
      - cursor/brainstem-summary-fe15
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCA3_SUMMARY_MODEL: openai/gpt-4.1-mini
        run: python3 fetch.py --check-models
